{{- /*
Runs the service's migrations as an Argo CD PreSync hook: on every sync, before
the Deployment(s) are updated, from the same image tag and configuration the
Deployment uses. A failed run fails the sync and leaves the running pods alone.
Off unless migrations.enabled is true.

No serviceAccountName on purpose: PreSync runs before the chart's own
ServiceAccount exists, and migrations only need the database.
*/ -}}
{{- $migrations := .Values.migrations | default dict }}
{{- if $migrations.enabled | default false }}
{{- $envConfig := .Values.secretEnv | default dict }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "+( .AppName ).fullname" . }}-migrate
  labels:
    {{- include "+( .AppName ).joblabels" . | nindent 4 }}
  annotations:
    argocd.argoproj.io/hook: PreSync
    # The previous run (and its logs) stays until the next sync replaces it.
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  backoffLimit: {{ $migrations.backoffLimit | default 1 }}
  activeDeadlineSeconds: {{ $migrations.activeDeadlineSeconds | default 600 }}
  template:
    metadata:
      labels:
        {{- include "+( .AppName ).joblabels" . | nindent 8 }}
    spec:
      restartPolicy: Never
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: migrate
          image: "{{ $migrations.image | default (printf "%s:%s" .Values.image.repository (.Values.image.tag | default .Chart.AppVersion)) }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          {{- with $migrations.command }}
          command:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with $migrations.args }}
          args:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- if $envConfig.enabled | default false }}
          envFrom:
          - secretRef:
              name: {{ $envConfig.secretName | quote }}
          {{- end }}
          env:
          {{- range $k, $v := .Values.env }}
          - name: {{ $k }}
            value: "{{ $v }}"
          {{- end }}
          resources:
            {{- toYaml ($migrations.resources | default .Values.resources) | nindent 12 }}
{{- end }}
